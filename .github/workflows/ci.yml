name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "integration/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Run standalone executable outside the build tree
        run: |
          cp dist/arty "$RUNNER_TEMP/arty"
          cd "$RUNNER_TEMP"
          env -u BUN_INSTALL PATH=/usr/bin:/bin ./arty --version
